apiVersion: apps/v1
kind: Deployment
metadata:
  name: paios-backend
  namespace: paios
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paios-backend
  template:
    metadata:
      labels:
        app: paios-backend
    spec:
      containers:
      - name: backend
        image: paios/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: paios-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
